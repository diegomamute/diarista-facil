<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Profissional diarista em primeiro plano e paisagem do Rio de Janeiro com o Cristo Redentor ao fundo">
<defs>
 <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#064b38"/><stop offset=".48" stop-color="#087d70"/><stop offset="1" stop-color="#159fd0"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#56d8d2"/><stop offset="1" stop-color="#087c83"/></linearGradient>
 <linearGradient id="hill" x2=".7" y2="1"><stop stop-color="#63d978"/><stop offset="1" stop-color="#075b42"/></linearGradient>
 <linearGradient id="apron" x2="1" y2="1"><stop stop-color="#078d50"/><stop offset="1" stop-color="#034d36"/></linearGradient>
 <linearGradient id="skin" x2=".8" y2="1"><stop stop-color="#ffd4ad"/><stop offset="1" stop-color="#c97952"/></linearGradient>
 <linearGradient id="hair" x2=".8" y2="1"><stop stop-color="#392019"/><stop offset=".55" stop-color="#17121a"/><stop offset="1" stop-color="#68402b"/></linearGradient>
 <linearGradient id="glove" x2="1" y2="1"><stop stop-color="#fff34b"/><stop offset="1" stop-color="#e8ad13"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffbd0"/><stop offset="1" stop-color="#fffbd0" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
