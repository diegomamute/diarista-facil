let p=await db.from('perfis').select('id,nome,tipo,telefone,bairro').eq('id',user.id).maybeSingle();if(p.error)throw p.error;let meta=user.user_metadata||{};if(!p.data&&mode==='login'){let up=await db.from('perfis').upsert({id:user.id,nome:meta.nome||email.split('@')[0],tipo:meta.tipo||'cliente',bairro:meta.bairro||null},{onConflict:'id'});if(up.error)throw up.error}currentUser={id:user.id,name:p.data?.nome||meta.nome||email.split('@')[0],email,type:p.data?.tipo||meta.tipo||'cliente',region:p.data?.bairro||meta.bairro||''};enterApp()}catch(err){alert('Não foi possível entrar: '+err.message);console.error(err)}}
async function forgotPassword(){let email=$('email').value.trim();if(!email)return alert('Digite seu e-mail primeiro.');let r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin});alert(r.error?r.error.message:'Confira seu e-mail para redefinir a senha.')}
function enterApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=currentUser.name.split(' ')[0];$('hello').textContent='Olá, '+currentUser.name.split(' ')[0]+'!';$('roleLabel').textContent=currentUser.type==='diarista'?'PAINEL DA DIARISTA':'PAINEL DO CLIENTE';$('homeMessage').textContent=currentUser.type==='diarista'?'Encontre oportunidades e converse com clientes.':'Publique seu pedido e negocie diretamente com profissionais.';$('clientHome').classList.toggle('hidden',currentUser.type!=='cliente');$('cleanerHome').classList.toggle('hidden',currentUser.type!=='diarista');$('profileName').textContent=currentUser.name;$('profileEmail').textContent=currentUser.email;$('profileRole').textContent=currentUser.type;openSection('home');startMessageNotifications();if(currentUser.type==='cliente')loadClientBookings();else loadOpportunities('open');updateUnreadBadge()}
async function logout(){if(chatChannel)await db.removeChannel(chatChannel);if(messageChannel)await db.removeChannel(messageChannel);if(notificationChannel)await db.removeChannel(notificationChannel);chatChannel=messageChannel=notificationChannel=null;currentUser=null;await db.auth.signOut();currentUser=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');authMode('login')}
function openSection(s){['homeSection','chatSection','profileSection'].forEach(id=>$(id).classList.add('hidden'));$(s==='home'?'homeSection':s==='chat'?'chatSection':'profileSection').classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));$('nav'+(s==='home'?'Home':s==='profile'?'Profile':'Chats')).classList.add('active');window.scrollTo(0,0)}
async function createBooking(e){e.preventDefault();if(currentUser?.type!=='cliente')return;let booking={cliente_id:currentUser.id,tipo_imovel:$('property').value,quartos:Number($('rooms').value||0),tipo_limpeza:'Padrão',bairro:$('neighborhood').value.trim(),data_servico:$('date').value,periodo:$('time').value,valor_estimado:Number($('amount').value),status:'Solicitação criada'};try{let r=await db.from('agendamentos').insert(booking).select().single();if(r.error)throw r.error;alert('Solicitação publicada! As diaristas poderão visualizar o pedido.');$('bookingForm').reset();loadClientBookings()}catch(err){alert('Erro ao publicar: '+err.message)}}
async function loadClientBookings(){let box=$('clientBookings');box.textContent='Carregando...';let r=await db.from('agendamentos').select('*').eq('cliente_id',currentUser.id).order('criado_em',{ascending:false});if(r.error){box.textContent='Não foi possível carregar: '+r.error.message;return}box.innerHTML=r.data.length?r.data.map(b=>bookingCard(b,'client')).join(''):'Você ainda não publicou pedidos.'}
function bookingCard(b,kind){return `<article class="border border-emerald-100 rounded-xl p-3"><div class="flex justify-between gap-2"><b>${esc(b.tipo_imovel)}</b><span class="status">${esc(b.status||'Solicitação')}</span></div><p class="small muted mt-1">${esc(b.bairro)} · ${esc(b.quartos)} quarto(s)</p><p class="small muted">${esc(b.data_servico)} às ${esc(b.periodo)}</p><div class="flex justify-between items-center mt-2"><strong class="text-emerald-700">${money(b.valor_estimado)}</strong>${kind==='client'?`<button class="btn secondary text-xs" onclick="showBookingChat('${b.id}','${b.diarista_id||''}')">Ver conversa</button>`:''}</div></article>`}
async function loadOpportunities(which='open',button){if(button){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));button.classList.add('active')}let box=$('opportunities');box.textContent='Buscando solicitações...';let q=db.from('agendamentos').select('*').order('criado_em',{ascending:false}).limit(100);if(which==='open')q=q.in('status',['Solicitação criada','Aberto','Pendente']);else q=q.eq('diarista_id',currentUser.id);let r=await q;if(r.error){box.textContent='Erro ao carregar oportunidades: '+r.error.message;return}let rows=r.data||[];if(which==='open')rows=rows.filter(b=>b.cliente_id!==currentUser.id);box.innerHTML=rows.length?rows.map(b=>`<article class="border border-emerald-100 rounded-2xl p-4"><div class="flex justify-between"><b>${esc(b.tipo_imovel)}</b><span class="status">${esc(b.status)}</span></div><p class="small muted mt-1"><i class="fa-solid fa-location-dot"></i> ${esc(b.bairro)}</p><p class="small muted">${esc(b.quartos)} quarto(s) · ${esc(b.data_servico)} · ${esc(b.periodo)}</p><div class="flex justify-between items-center mt-3"><strong class="text-xl text-emerald-700">${money(b.valor_estimado)}</strong><div class="flex gap-2"><button class="btn secondary text-xs" onclick="respondBooking('${b.id}','Recusado')">Recusar</button><button class="btn primary text-xs" onclick="respondBooking('${b.id}','Aceito')">Tenho interesse</button></div></div></article>`).join(''):'Nenhuma oportunidade disponível no momento.'}
async function respondBooking(id,status){
  if(currentUser?.type!=='diarista')return alert('Entre com uma conta de diarista para responder.');
  if(!['Aceito','Recusado'].includes(status))return;
  try{
    const upd={diarista_id:currentUser.id,status};
    const r=await db.from('agendamentos')
      .update(upd)
      .eq('id',id)
      .in('status',['Solicitação criada','Aberto','Pendente'])
      .select('*')
      .maybeSingle();
    if(r.error)throw r.error;
    if(!r.data){
      alert('A solicitação não foi atualizada. O banco não retornou nenhum agendamento permitido. Confira a política RLS de UPDATE para diaristas e se o pedido ainda está disponível.');
      return;
    }
    await openChat(r.data);
    alert(status==='Aceito'?'Interesse enviado! O chat foi aberto.':'Recusa registrada! O chat foi aberto.');
    if(status==='Aceito')loadOpportunities('mine');
    else loadOpportunities('open');
  }catch(err){
    alert('Não foi possível responder à solicitação: '+(err.message||String(err))+'\nVerifique a política RLS de UPDATE para diaristas na tabela agendamentos.');
    console.error(err);
  }
}
async function ensureChatReady(){/* As mensagens usam as colunas existentes e a migração adiciona agendamento_id. */}
async function openChat(b){activeBooking=b;openSection('chat');$('chatTitle').textContent='Conversa sobre '+b.tipo_imovel;$('chatSubtitle').textContent=b.bairro+' · '+money(b.valor_estimado)+' · '+(b.status||'Solicitação');await loadMessages();await markBookingMessagesRead(b.id);if(messageChannel)await db.removeChannel(messageChannel);messageChannel=db.channel('chat-'+b.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'mensagens',filter:'agendamento_id=eq.'+b.id},payload=>appendMessage(payload.new)).subscribe()}
async function loadMessages(){let box=$('chatMessages');box.innerHTML='<p class="muted small">Carregando mensagens...</p>';let r=await db.from('mensagens').select('*').eq('agendamento_id',activeBooking.id).order('criado_em',{ascending:true});if(r.error){box.innerHTML='<div class="notice">O chat precisa da coluna <b>agendamento_id</b> na tabela mensagens e das permissões RLS correspondentes. '+esc(r.error.message)+'</div>';return}box.innerHTML=r.data.map(messageHTML).join('')||'<p class="muted small text-center">Comece a conversa. Combine os detalhes do serviço por aqui.</p>';box.scrollTop=box.scrollHeight}
function messageHTML(m){return `<div data-id="${esc(m.id)}" class="chat-bubble ${m.remetente_id===currentUser.id?'mine':'theirs'}"><div>${esc(m.conteudo)}</div><div class="text-[10px] muted text-right mt-1">${m.criado_em?new Date(m.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}</div></div>`}function appendMessage(m){if(!$('chatMessages').querySelector('[data-id="'+m.id+'"]')){$('chatMessages').insertAdjacentHTML('beforeend',messageHTML(m));$('chatMessages').scrollTop=$('chatMessages').scrollHeight}}
async function sendMessage(e){e.preventDefault();if(!activeBooking)return;let text=$('messageInput').value.trim();if(!text)return;let receiver=currentUser.id===activeBooking.cliente_id?activeBooking.diarista_id:activeBooking.cliente_id;if(!receiver){alert('A conversa só pode ser iniciada quando houver uma diarista vinculada ao pedido.');return}let r=await db.from('mensagens').insert({remetente_id:currentUser.id,destinatario_id:receiver,conteudo:text,agendamento_id:activeBooking.id}).select().single();if(r.error){alert('Não foi possível enviar: '+r.error.message);return}$('messageInput').value='';appendMessage(r.data);updateUnreadBadge()}
function readMessageIds(){try{return JSON.parse(localStorage.getItem('df_lidas_'+currentUser.id)||'[]')}catch(e){return []}}
function saveReadMessageIds(ids){localStorage.setItem('df_lidas_'+currentUser.id,JSON.stringify([...new Set(ids)]))}
async function getIncomingMessages(){let r=await db.from('mensagens').select('id,agendamento_id,remetente_id,destinatario_id,conteudo,criado_em').eq('destinatario_id',currentUser.id).order('criado_em',{ascending:false}).limit(300);if(r.error){console.warn('Não foi possível consultar mensagens recebidas',r.error);return []}return r.data||[]}
async function updateUnreadBadge(){if(!currentUser)return;let msgs=await getIncomingMessages(),seen=new Set(readMessageIds()),unread=msgs.filter(m=>!seen.has(String(m.id))).length,badge=$('navChatBadge');badge.textContent=unread>99?'99+':String(unread);badge.classList.toggle('hidden',unread===0);return {msgs,unread}}
async function markBookingMessagesRead(bookingId){if(!currentUser)return;let msgs=await getIncomingMessages(),ids=msgs.filter(m=>m.agendamento_id===bookingId).map(m=>String(m.id));saveReadMessageIds([...readMessageIds(),...ids]);updateUnreadBadge()}
function showMessageToast(m){let old=$('messageToast');if(old)old.remove();let el=document.createElement('div');el.id='messageToast';el.className='toast-message';el.innerHTML='<i class="fa-solid fa-message"></i> Nova mensagem recebida: '+esc((m.conteudo||'').slice(0,90));el.onclick=()=>{el.remove();showChats()};document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),6500)}
function startMessageNotifications(){if(!currentUser)return;if(notificationChannel)db.removeChannel(notificationChannel);notificationChannel=db.channel('notificacoes-'+currentUser.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'mensagens',filter:'destinatario_id=eq.'+currentUser.id},payload=>{let m=payload.new;if(activeBooking&&activeBooking.id===m.agendamento_id){appendMessage(m);markBookingMessagesRead(m.agendamento_id)}else{showMessageToast(m);updateUnreadBadge()}}).subscribe();}
async function showChats(){if(!currentUser)return;openSection('home');let table=currentUser.type==='cliente'?'cliente_id':'diarista_id';let r=await db.from('agendamentos').select('*').eq(table,currentUser.id).order('criado_em',{ascending:false});if(r.error){alert('Não foi possível carregar conversas: '+r.error.message);return}let rows=r.data||[],{msgs}=await updateUnreadBadge(),seen=new Set(readMessageIds()),unreadByBooking={};msgs.filter(m=>!seen.has(String(m.id))).forEach(m=>{unreadByBooking[m.agendamento_id]=(unreadByBooking[m.agendamento_id]||0)+1});let box=currentUser.type==='cliente'?$('clientBookings'):$('opportunities');let conversations=rows.filter(b=>b.diarista_id||msgs.some(m=>m.agendamento_id===b.id));box.innerHTML=conversations.length?conversations.map(b=>{let count=unreadByBooking[b.id]||0,last=msgs.find(m=>m.agendamento_id===b.id);return `<article class="border rounded-xl p-3 mb-3 ${count?'new-message-card':''}"><div class="flex justify-between gap-2 items-center"><b>${esc(b.tipo_imovel)} · ${esc(b.bairro)}</b>${count?`<span class="new-message-label">${count} nova${count>1?'s':''} mensagem${count>1?'s':''}</span>`:''}</div><p class="small muted mt-1">${esc(b.status||'Conversa')}</p>${last?`<p class="text-sm mt-2">${esc(last.conteudo)}</p>`:''}<button class="btn ${count?'primary':'secondary'} text-xs mt-3" onclick="showBookingChat('${b.id}')">Abrir conversa</button></article>`}).join(''):'<div class="notice">Nenhuma conversa encontrada para esta conta. Quando alguém enviar uma mensagem, ela aparecerá aqui.</div>'}
async function showBookingChat(id){let r=await db.from('agendamentos').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);openChat(r.data)}
document.addEventListener('DOMContentLoaded',async()=>{if(!db){alert('Não foi possível carregar o Supabase.');return}let r=await db.auth.getSession();if(r.data.session){let u=r.data.session.user,p=await db.from('perfis').select('id,nome,tipo,bairro').eq('id',u.id).maybeSingle();let m=u.user_metadata||{};currentUser={id:u.id,name:p.data?.nome||m.nome||u.email.split('@')[0],email:u.email,type:p.data?.tipo||m.tipo||'cliente',region:p.data?.bairro||m.bairro||''};enterApp()}});
</script></body></html>
